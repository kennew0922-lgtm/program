<style>
/* SAO風のコンテナ枠設定 */
.sao-video-container {
    position: relative;
    width: 720px;
    margin: 0 auto;
    padding: 6px; /* 内側の黒い隙間（SAOの二重枠っぽさ） */
    background: rgba(0, 0, 0, 0.6); /* 半透明のダーク背景 */
    border: 2px solid #ff7700; /* SAOといえば情熱的なオレンジ、またはサイバーな淡い光 */
    box-shadow: 0 0 15px rgba(255, 119, 0, 0.4), inset 0 0 10px rgba(255, 119, 0, 0.3);
    border-radius: 4px;
    overflow: hidden;
    box-sizing: border-box;
}

/* 動画自体のスタイル */
.sao-movie-content {
    display: block;
    width: 100%;
    height: auto;
    border: 1px solid rgba(255, 255, 255, 0.2); /* 内枠のシャープな白いライン */
}

/* 四隅の近未来UI風コーナーデコレーション */
.sao-corner {
    position: absolute;
    width: 12px;
    height: 12px;
    border: 3px solid #ffffff; /* 輝く角のアクセント */
    z-index: 10;
}
.sao-corner.tl { top: 0; left: 0; border-right: none; border-bottom: none; }
.sao-corner.tr { top: 0; right: 0; border-left: none; border-bottom: none; }
.sao-corner.bl { bottom: 0; left: 0; border-right: none; border-top: none; }
.sao-corner.br { bottom: 0; right: 0; border-left: none; border-top: none; }

/* 画面を走る、うっすらとした近未来風スキャンライン効果（オシャレ用） */
.sao-scanline {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));

    pointer-events: none; /* クリックを邪魔しない */
    z-index: 5;
    opacity: 0.4;
}

/* 左上に浮かぶUI風のステータスタグ */
.sao-tag {

    top: 10px;
    left: 15px;
    background: #ff7700;
    color: #ffffff;
